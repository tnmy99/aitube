<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AItube: AI education worth your time</title>
<meta name="description" content="A hand-built library of the best AI education on YouTube: university courses, learning paths and talks, with a written reason for every video. No accounts, no tracking.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com 'sha256-gkCqY4+OuOhcn3ZHVZfuKj9zvMxwiSAhzMZmexD39DA='; frame-src https://www.youtube-nocookie.com https://www.youtube.com; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f0f0f">
<meta name="color-scheme" content="dark light">
<meta property="og:type" content="website">
<meta property="og:title" content="AItube: AI education worth your time">
<meta property="og:description" content="University courses, learning paths and talks, chosen by hand. Every video is here for a reason.">
<meta property="og:image" content="https://tnmy99.github.io/aitube/og.png">
<meta property="og:url" content="https://tnmy99.github.io/aitube/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tnmy99.github.io/aitube/og.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="data/catalog.json" as="fetch" crossorigin>
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem("ait.theme")||localStorage.getItem("aet.theme");if(!t&&matchMedia("(prefers-color-scheme: light)").matches)t="light";if(t==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-controls="side" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="logo" href="#/" aria-label="AItube home"><svg class="logo-mark" viewBox="0 0 32 24" aria-hidden="true"><rect width="32" height="24" rx="7" style="fill:var(--accent-strong)"/><g stroke="#fff" stroke-width="1.6" fill="none" opacity=".9"><path d="M9 7l7 5-7 5M16 12h7"/></g><g fill="#fff"><circle cx="9" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/><circle cx="16" cy="12" r="2.6"/><circle cx="23" cy="12" r="2.3"/></g></svg><span class="logo-word"><span class="ai">AI</span>tube</span></a>
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search AI videos, topics, channels" aria-label="Search" role="combobox"
      aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" enterkeyhint="search" spellcheck="false">
    <button type="submit" class="search-go" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <div id="suggest" class="suggest" role="listbox" aria-label="Search suggestions" hidden></div>
  </form>
  <div class="top-right">
    <button type="button" class="btn ghost" id="luckyBtn" title="Play a random top-tier video (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>Surprise me</button>
    <button type="button" class="icon-btn" id="tvBtn" title="TV mode (T)" aria-label="TV mode"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M10 9.5v5l4-2.5z"/></svg></button>
    <button type="button" class="icon-btn" id="helpBtn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.7M12 17.2v.1"/></svg></button>
    <button type="button" class="icon-btn" id="themeBtn" title="Light / dark" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg></button>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1">
    <noscript><div class="empty"><h1>AItube needs JavaScript</h1><p>The feed, search and the YouTube player all run in your browser.</p></div></noscript>
  </main>
</div>
<div id="tv" class="tv" role="dialog" aria-label="TV mode" hidden>
  <div class="tv-player"><div id="tvFrame"></div></div>
  <div class="tv-bar">
    <span class="tv-title" id="tvTitle" aria-live="polite"></span>
    <span class="tv-keys">N next · P previous · Space pause · ←→ 10s · 1–9 jump · M mute · Esc exit</span>
    <button type="button" class="btn small" id="tvNext">Next ▸</button>
    <button type="button" class="btn small" id="tvExit">Exit</button>
  </div>
</div>
<div id="modal" class="modal" hidden></div>
<div id="cardmenu" class="cardmenu" role="menu" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
